[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikidata-research"
version = "0.1.0"
description = "Evidence-first agent-assisted Wikidata and Wikipedia research workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wikidata-research = "wikidata_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
